# ==================== 应用配置示例 ====================
# PID控制器自动整定系统配置文件
# 复制此文件为 application.properties 并根据实际环境修改配置

# ==================== 日志配置 ====================
# 日志级别：DEBUG, INFO, WARNING, ERROR, CRITICAL
log.level=INFO
# 日志格式
log.format=%(asctime)s - %(name)s - %(levelname)s - %(message)s

# ==================== TSDB时序数据库配置 ====================
# 是否使用真实TSDB（true/false）
# TSDB服务地址
tsdb.base_url=http://tsdb-select-infra-system.sit-cloud.ieccloud.hollicube.com
# 请求超时时间（秒）
tsdb.timeout=30
# 最大重试次数
tsdb.max_retries=3
# 认证令牌（可选）
tsdb.auth_token=
# 默认数据库名称
tsdb.database=platform

# ==================== 模拟数据配置 ====================
# 模拟数据存储目录
simulation.data_dir=data/simulated

# ==================== 工作流代理配置 ====================
# 工作流服务地址
workflow.base_url=http://192.168.202.172
# 工作流认证令牌
workflow.token=app-ZJxenSh1D9uFCqnGO7Dt917p
# 总超时时间（秒）
workflow.timeout=120
# 连接超时时间（秒）
workflow.connect_timeout=30
# 读取超时时间（秒）
workflow.read_timeout=300
# 健康检查超时时间（秒）
workflow.health_check_timeout=10

# ==================== BFF模型查询配置 ====================
# BFF模型服务地址
bff.model.base_url=http://bff-model-product-infra-system.sit-cloud.ieccloud.hollicube.com
# 请求超时时间（秒）
bff.model.timeout=30
# 默认回路URI
bff.model.loop_uri=/pid_zd/0b521c82a96d4107a564e4c2678bdeca
# 默认测点路径
bff.model.point_path=/loop_state_parameters
# BFF模型树根节点URI
bff.model.root_uri=/pid_zd/053f3c45413b48bbafacec609d142e57
# BFF单回路模型URI
bff.model.loop_model_uri=/pid_zd/31512b195f3f4cca9a08a9aeeb3bb243
# BFF装置模型URI（通用文件夹类型）
bff.model.device_model_uri=/system/401

# PID控制字段与模型browse_name名称映射关系
bff.model.pid_point.mv=MV
bff.model.pid_point.pv=PV
bff.model.pid_point.sv=SV
bff.model.pid_point.pb=PB
bff.model.pid_point.ti=TI
bff.model.pid_point.td=TD
bff.model.pid_point.auto=AUTO

# ==================== 定时任务配置 ====================
# 启用回路性能计算定时任务
task.loop_performance.enable=true
# 回路性能计算任务Cron表达式 (默认每小时执行一次)
# Cron格式: 分(0-59) 小时(0-23) 天(1-31) 月(1-12) 周(0-6)
# 示例: '0 * * * *' = 每小时, '0 0 * * *' = 每天00:00, '*/30 * * * *' = 每30分钟
task.loop_performance.cron=*/10 * * * *
# 回路性能计算任务最大工作线程数
task.loop_performance.max_workers=5
# 是否写入评估结果到明细表
task.loop_performance.persist.enable=true
# 仅写入综合评分不低于该阈值的结果（0-100）
task.loop_performance.persist.min_score=0

# 启用模型树加载定时任务
task.load_model_tree.enable=true
# 模型树加载任务Cron表达式 (默认每10分钟执行)
task.load_model_tree.cron=*/10 * * * *

# 启用装置性能统计定时任务
task.device_stats.enable=true
# 装置性能统计任务Cron表达式 (默认每天01:00执行，在回路评估之后)
task.device_stats.cron=*/10 * * * *
# 装置性能统计任务最大工作线程数
task.device_stats.max_workers=3

# ==================== 数据库配置 ====================
# 数据库主机地址
db.host=192.168.201.113
# 数据库端口
db.port=15432
# 数据库用户名
db.user=postgres
# 数据库密码
db.password=Postgres#7556
# 数据库名称
db.name=pid_controller
# 是否打印SQL语句（true/false，调试用）
db.sql.echo=false
# 连接池大小
db.pool_size=10
# 连接池最大溢出数
db.max_overflow=20

# ==================== 回路优化阈值配置 ====================
# 性能分数阈值（低于此值认为需要优化，默认80.0）
loop.performance.threshold=80.0
# 稳定率阈值（低于此值认为需要优化，默认90.0）
loop.stability.threshold=90.0
# 自控率阈值（高于此值认为是自控回路，默认0.8）
loop.auto_control.threshold=80
# 平稳率阈值（高于此值认为是平稳回路，默认0.8）
loop.stable.threshold=70

# 数据库连接URL（可选，如果设置则优先使用此URL）
# 支持 PostgreSQL 和 SQLite
# PostgreSQL: postgresql://user:password@host:port/dbname
# SQLite: sqlite:///./database.db
# db.url=postgresql://postgres:Postgres#7556@192.168.201.113:15432/pid_controller
