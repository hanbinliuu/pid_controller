version: '3.8'

services:
  pid-agent:
    build: .
    container_name: pid-agent-mvp
    ports:
      - "8001:8001"
    environment:
      # 日志配置
      - LOG_LEVEL=INFO
      
      # 数据库配置（示例 - 请根据实际情况修改）
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=your_password
      - DB_NAME=pid_controller
      
      # TSDB 配置
      - TSDB_BASE_URL=http://tsdb-select-infra-system.sit-cloud.ieccloud.hollicube.com
      - TSDB_TIMEOUT=30
      
      # BFF 模型配置
      - BFF_MODEL_BASE_URL=http://bff-model-product-infra-system.sit-cloud.ieccloud.hollicube.com
      
      # 工作流配置
      - WORKFLOW_BASE_URL=http://192.168.202.172
      - WORKFLOW_TOKEN=app-ZJxenSh1D9uFCqnGO7Dt917p
      
      # 回路优化阈值
      - LOOP_PERFORMANCE_THRESHOLD=80.0
      - LOOP_STABILITY_THRESHOLD=90.0
      - LOOP_AUTO_CONTROL_THRESHOLD=0.8
      - LOOP_STABLE_THRESHOLD=0.8
      
    volumes:
      # 挂载配置文件（可选）
      - ./config/application.properties:/app/config/application.properties
      # 挂载数据目录
      - ./data:/app/data
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - pid-network

  # 可选：PostgreSQL 数据库服务
  # postgres:
  #   image: postgres:14-alpine
  #   container_name: pid-postgres
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=your_password
  #     - POSTGRES_DB=pid_controller
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - pid-network

networks:
  pid-network:
    driver: bridge

