version: '3.10.8'

services:
  pid-agent-api:
    build: .
    container_name: pid-agent-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pid-agent-network

  # 可选：添加Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: pid-agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - pid-agent-api
    restart: unless-stopped
    networks:
      - pid-agent-network
    profiles:
      - production

networks:
  pid-agent-network:
    driver: bridge

volumes:
  pid-data:
    driver: local
  nginx-logs:
    driver: local