version: '3.10.8'

services:
  pid-agent-api:
    build: .
    container_name: pid-agent-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # 数据库配置 - 可通过.env文件覆盖
      - DB_HOST=${DB_HOST:-192.168.201.113}
      - DB_PORT=${DB_PORT:-15432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Postgres#7556}
      - DB_NAME=${DB_NAME:-pid_controller}
      - DATABASE_URL=${DATABASE_URL}
      - SQL_ECHO=${SQL_ECHO:-false}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # TSDB配置
      - USE_REAL_TSDB=${USE_REAL_TSDB:-false}
      - TSDB_BASE_URL=${TSDB_BASE_URL:-http://tsdb-select-infra-system.sit-cloud.ieccloud.hollicube.com}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pid-agent-network

  # 可选：添加Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: pid-agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - pid-agent-api
    restart: unless-stopped
    networks:
      - pid-agent-network
    profiles:
      - production

networks:
  pid-agent-network:
    driver: bridge

volumes:
  pid-data:
    driver: local
  nginx-logs:
    driver: local