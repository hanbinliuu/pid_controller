<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回路实时监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        .status-auto {
            background-color: #d4edda;
            color: #155724;
        }
        .status-manual {
            background-color: #f8f9fa;
            color: #6c757d;
        }
        .status-abnormal {
            background-color: #f8d7da;
            color: #721c24;
        }
        .trend-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .trend-modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 1200px;
            border-radius: 5px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        .filter-panel {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .no-data {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <h2>回路实时监控</h2>
        
        <!-- 筛选面板 -->
        <div class="filter-panel">
            <div class="row">
                <div class="col-md-3">
                    <label for="plantSelect" class="form-label">装置筛选</label>
                    <select class="form-select" id="plantSelect">
                        <option value="">全部装置</option>
                        <option value="/pid_zd/plant1">Plant 1</option>
                        <option value="/pid_zd/plant2">Plant 2</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="loopNameInput" class="form-label">回路名称</label>
                    <input type="text" class="form-control" id="loopNameInput" placeholder="输入回路名称">
                </div>
                <div class="col-md-3">
                    <label for="statusSelect" class="form-label">状态筛选</label>
                    <select class="form-select" id="statusSelect">
                        <option value="">全部状态</option>
                        <option value="自动">自动</option>
                        <option value="手动">手动</option>
                        <option value="异常">异常</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <div>
                        <button class="btn btn-primary" onclick="searchLoops()">查询</button>
                        <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 回路列表 -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>序号</th>
                        <th>回路名称</th>
                        <th>描述</th>
                        <th>回路类型</th>
                        <th>自控情况</th>
                        <th>剔除条件</th>
                        <th>运行状态</th>
                        <th>回路特性</th>
                        <th>当前PV值</th>
                        <th>当前SV值</th>
                        <th>当前MV值</th>
                        <th>平稳情况</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="loopTableBody">
                    <!-- 数据将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- 分页将通过JavaScript动态生成 -->
            </ul>
        </nav>
        
        <!-- 趋势图模态框 -->
        <div id="trendModal" class="trend-modal">
            <div class="trend-modal-content">
                <span class="close" onclick="closeTrendModal()">&times;</span>
                <h3 id="trendTitle">趋势图</h3>
                <div class="mb-3">
                    <button class="btn btn-sm btn-outline-primary" onclick="changeTimeRange(1)">近1小时</button>
                    <button class="btn btn-sm btn-outline-primary" onclick="changeTimeRange(4)">近4小时</button>
                    <button class="btn btn-sm btn-outline-primary" onclick="changeTimeRange(12)">近12小时</button>
                </div>
                <div id="trendChart" style="width: 100%; height: 500px;"></div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPage = 1;
        let currentLoopUri = '';
        let trendChart = null;
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            searchLoops();
        });
        
        // 查询回路列表
        function searchLoops(page = 1) {
            currentPage = page;
            
            const plantUri = document.getElementById('plantSelect').value;
            const loopName = document.getElementById('loopNameInput').value;
            const status = document.getElementById('statusSelect').value;
            
            // 构造查询参数
            const params = new URLSearchParams();
            if (plantUri) params.append('plant_uri', plantUri);
            if (loopName) params.append('loop_name', loopName);
            if (status) params.append('status', status);
            params.append('page_no', page);
            params.append('page_size', 20);
            
            // 发送请求
            fetch(`/api/monitoring/realtime-status?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderLoopTable(data.data.loops);
                        renderPagination(data.data.pagination);
                    } else {
                        alert('查询失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('查询失败，请稍后重试');
                });
        }
        
        // 渲染回路列表
        function renderLoopTable(loops) {
            const tbody = document.getElementById('loopTableBody');
            tbody.innerHTML = '';
            
            if (loops.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="13" class="no-data">
                            <h4>无匹配回路</h4>
                            <p>请调整筛选条件</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            loops.forEach((loop, index) => {
                // 根据自控情况设置样式
                let statusClass = '';
                if (loop.control_status === '自动') {
                    statusClass = 'status-auto';
                } else if (loop.control_status === '手动') {
                    statusClass = 'status-manual';
                } else {
                    statusClass = 'status-abnormal';
                }
                
                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${loop.loop_name || '--'}</td>
                        <td>${loop.description || '--'}</td>
                        <td>${loop.loop_type || '--'}</td>
                        <td><span class="badge ${statusClass}">${loop.control_status || '--'}</span></td>
                        <td>${loop.exclusion_condition || '--'}</td>
                        <td>${loop.running_status || '--'}</td>
                        <td>${loop.loop_characteristics || '--'}</td>
                        <td>${loop.current_pv || '--'}</td>
                        <td>${loop.current_sv || '--'}</td>
                        <td>${loop.current_mv || '--'}</td>
                        <td>${loop.stability || '--'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="showTrend('${loop.loop_uri}', '${loop.loop_name}')">
                                查看趋势
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        // 渲染分页
        function renderPagination(pagination) {
            const ul = document.getElementById('pagination');
            ul.innerHTML = '';
            
            const { total, pages, pageNo, pageSize } = pagination;
            
            // 上一页
            if (pageNo > 1) {
                ul.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="searchLoops(${pageNo - 1})">上一页</a></li>`;
            }
            
            // 页码
            for (let i = 1; i <= pages; i++) {
                if (i === pageNo) {
                    ul.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                } else {
                    ul.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="searchLoops(${i})">${i}</a></li>`;
                }
            }
            
            // 下一页
            if (pageNo < pages) {
                ul.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="searchLoops(${pageNo + 1})">下一页</a></li>`;
            }
        }
        
        // 重置筛选条件
        function resetFilters() {
            document.getElementById('plantSelect').value = '';
            document.getElementById('loopNameInput').value = '';
            document.getElementById('statusSelect').value = '';
            searchLoops();
        }
        
        // 显示趋势图
        function showTrend(loopUri, loopName) {
            currentLoopUri = loopUri;
            document.getElementById('trendTitle').textContent = `${loopName} 趋势图`;
            document.getElementById('trendModal').style.display = 'block';
            
            // 默认显示近1小时数据
            loadTrendData(1);
        }
        
        // 关闭趋势图模态框
        function closeTrendModal() {
            document.getElementById('trendModal').style.display = 'none';
            if (trendChart) {
                trendChart.dispose();
                trendChart = null;
            }
        }
        
        // 更改时间范围
        function changeTimeRange(hours) {
            loadTrendData(hours);
        }
        
        // 加载趋势数据
        function loadTrendData(timeRange) {
            if (!currentLoopUri) return;
            
            const params = new URLSearchParams({
                loop_uri: currentLoopUri,
                time_range: timeRange
            });
            
            fetch(`/api/monitoring/trend-data?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderTrendChart(data.data);
                    } else {
                        alert('加载趋势数据失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('加载趋势数据失败，请稍后重试');
                });
        }
        
        // 渲染趋势图
        function renderTrendChart(trendData) {
            const chartDom = document.getElementById('trendChart');
            
            if (trendChart) {
                trendChart.dispose();
            }
            
            trendChart = echarts.init(chartDom);
            
            // 检查是否有数据
            if (!trendData.trend_data || 
                !trendData.trend_data.timestamps || 
                trendData.trend_data.timestamps.length === 0) {
                trendChart.setOption({
                    title: {
                        text: '暂无实时数据',
                        left: 'center',
                        top: 'center'
                    }
                });
                return;
            }
            
            // 转换时间戳为日期格式
            const timestamps = trendData.trend_data.timestamps.map(ts => {
                const date = new Date(ts);
                return date.toLocaleTimeString('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            });
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: function (params) {
                        let result = params[0].axisValueLabel + '<br/>';
                        params.forEach(param => {
                            result += `${param.seriesName}: ${param.value}<br/>`;
                        });
                        return result;
                    }
                },
                legend: {
                    data: ['PV', 'SV', 'MV']
                },
                xAxis: {
                    type: 'category',
                    data: timestamps
                },
                yAxis: [
                    {
                        type: 'value',
                        name: 'PV/SV',
                        position: 'left'
                    },
                    {
                        type: 'value',
                        name: 'MV',
                        position: 'right',
                        min: 0,
                        max: 100
                    }
                ],
                series: [
                    {
                        name: 'PV',
                        type: 'line',
                        yAxisIndex: 0,
                        data: trendData.trend_data.pv_values,
                        smooth: true,
                        color: 'green'
                    },
                    {
                        name: 'SV',
                        type: 'line',
                        yAxisIndex: 0,
                        data: trendData.trend_data.sv_values,
                        smooth: true,
                        color: 'red',
                        lineStyle: {
                            type: 'dashed'
                        }
                    },
                    {
                        name: 'MV',
                        type: 'line',
                        yAxisIndex: 1,
                        data: trendData.trend_data.mv_values,
                        smooth: true,
                        color: 'blue'
                    }
                ],
                dataZoom: [
                    {
                        type: 'inside',
                        start: 0,
                        end: 100
                    },
                    {
                        start: 0,
                        end: 100
                    }
                ]
            };
            
            trendChart.setOption(option);
        }
        
        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('trendModal');
            if (event.target == modal) {
                closeTrendModal();
            }
        }
    </script>
</body>
</html>
