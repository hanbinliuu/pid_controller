<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>条件剔除回路管理</title>
    <!-- Element UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f5f5;
        }
        #app {
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
        }
        .search-bar {
            margin-bottom: 20px;
        }
        .operation-buttons {
            margin-bottom: 20px;
        }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
        }
        .status-tag {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 页面头部 -->
        <div class="header">
            <h1 style="margin: 0;">条件剔除回路管理</h1>
            <p style="margin: 10px 0 0 0; color: #909399;">管理需要条件剔除的回路和装置</p>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <el-card>
                <el-form :inline="true" :model="searchForm" size="small">
                    <el-form-item label="名称">
                        <el-input v-model="searchForm.name" placeholder="请输入名称" clearable style="width: 300px;"></el-input>
                    </el-form-item>
                    <el-form-item label="类型">
                        <el-select v-model="searchForm.type" placeholder="请选择类型" clearable style="width: 150px;">
                            <el-option label="回路" value="回路"></el-option>
                            <el-option label="装置" value="装置"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="剔除状态">
                        <el-select v-model="searchForm.is_excluded" placeholder="请选择状态" clearable style="width: 150px;">
                            <el-option label="已剔除" :value="true"></el-option>
                            <el-option label="未剔除" :value="false"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" icon="el-icon-search" @click="handleSearch">搜索</el-button>
                        <el-button icon="el-icon-refresh" @click="handleReset">重置</el-button>
                    </el-form-item>
                </el-form>
            </el-card>
        </div>

        <!-- 操作按钮 -->
        <div class="operation-buttons">
            <el-button type="primary" icon="el-icon-plus" size="small" @click="handleAdd">添加剔除</el-button>
            <el-button type="success" icon="el-icon-download" size="small" @click="handleBatchAdd">批量添加</el-button>
            <el-button type="warning" icon="el-icon-delete" size="small" @click="handleBatchRemove" :disabled="selectedRows.length === 0">批量移除</el-button>
            <el-button type="danger" icon="el-icon-delete" size="small" @click="handleBatchDelete" :disabled="selectedRows.length === 0">批量删除</el-button>
        </div>

        <!-- 数据表格 -->
        <div class="table-container">
            <el-table 
                :data="tableData" 
                v-loading="loading"
                @selection-change="handleSelectionChange"
                stripe
                border
                style="width: 100%">
                <el-table-column type="selection" width="55"></el-table-column>
                <el-table-column prop="id" label="ID" width="80"></el-table-column>
                <el-table-column prop="name" label="名称" min-width="250" show-overflow-tooltip></el-table-column>
                <el-table-column prop="type" label="类型" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.type === '回路' ? 'primary' : 'success'" size="small">
                            {{ scope.row.type }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="is_excluded" label="剔除状态" width="120">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.is_excluded ? 'danger' : 'info'" size="small" class="status-tag">
                            {{ scope.row.is_excluded ? '已剔除' : '未剔除' }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="reason" label="剔除原因" min-width="200" show-overflow-tooltip></el-table-column>
                <el-table-column prop="created_time" label="创建时间" width="160">
                    <template slot-scope="scope">
                        {{ formatTime(scope.row.created_time) }}
                    </template>
                </el-table-column>
                <el-table-column prop="updated_time" label="更新时间" width="160">
                    <template slot-scope="scope">
                        {{ formatTime(scope.row.updated_time) }}
                    </template>
                </el-table-column>
                <el-table-column label="操作" width="200" fixed="right">
                    <template slot-scope="scope">
                        <el-button size="mini" type="primary" icon="el-icon-edit" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button size="mini" type="danger" icon="el-icon-delete" @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <el-pagination
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
                :current-page="pagination.pageNo"
                :page-sizes="[10, 20, 50, 100]"
                :page-size="pagination.pageSize"
                :total="pagination.total"
                layout="total, sizes, prev, pager, next, jumper"
                style="margin-top: 20px; text-align: right;">
            </el-pagination>
        </div>

        <!-- 添加/编辑对话框 -->
        <el-dialog 
            :title="dialogTitle" 
            :visible.sync="dialogVisible"
            width="600px"
            @close="handleDialogClose">
            <el-form :model="form" :rules="formRules" ref="form" label-width="100px">
                <el-form-item label="名称" prop="name">
                    <el-input v-model="form.name" placeholder="请输入回路或装置名称"></el-input>
                </el-form-item>
                <el-form-item label="类型" prop="type">
                    <el-select v-model="form.type" placeholder="请选择类型" style="width: 100%;">
                        <el-option label="回路" value="回路"></el-option>
                        <el-option label="装置" value="装置"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="剔除状态" prop="is_excluded">
                    <el-switch v-model="form.is_excluded" active-text="已剔除" inactive-text="未剔除"></el-switch>
                </el-form-item>
                <el-form-item label="剔除原因" prop="reason">
                    <el-input 
                        v-model="form.reason" 
                        type="textarea" 
                        :rows="3"
                        placeholder="请输入剔除原因"></el-input>
                </el-form-item>
            </el-form>
            <span slot="footer" class="dialog-footer">
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="primary" @click="handleSubmit" :loading="submitLoading">确定</el-button>
            </span>
        </el-dialog>

        <!-- 批量添加对话框 -->
        <el-dialog 
            title="批量添加条件剔除" 
            :visible.sync="batchDialogVisible"
            width="600px">
            <el-form :model="batchForm" :rules="batchFormRules" ref="batchForm" label-width="100px">
                <el-form-item label="URI列表" prop="uris">
                    <el-input 
                        v-model="batchForm.urisText" 
                        type="textarea" 
                        :rows="8"
                        placeholder="每行一个URI，例如：&#10;/pid_zd/loop1&#10;/pid_zd/loop2&#10;/pid_zd/device1"></el-input>
                    <span style="color: #909399; font-size: 12px;">每行输入一个URI</span>
                </el-form-item>
                <el-form-item label="类型" prop="type">
                    <el-select v-model="batchForm.type" placeholder="请选择类型" style="width: 100%;">
                        <el-option label="回路" value="回路"></el-option>
                        <el-option label="装置" value="装置"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="剔除原因" prop="reason">
                    <el-input 
                        v-model="batchForm.reason" 
                        type="textarea" 
                        :rows="3"
                        placeholder="请输入剔除原因"></el-input>
                </el-form-item>
            </el-form>
            <span slot="footer" class="dialog-footer">
                <el-button @click="batchDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="handleBatchSubmit" :loading="submitLoading">确定</el-button>
            </span>
        </el-dialog>
    </div>

    <!-- Vue -->
    <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
    <!-- Element UI -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    // 搜索表单
                    searchForm: {
                        name: '',
                        type: '',
                        is_excluded: null
                    },
                    // 表格数据
                    tableData: [],
                    loading: false,
                    // 分页
                    pagination: {
                        pageNo: 1,
                        pageSize: 10,
                        total: 0,
                        pages: 0
                    },
                    // 选中的行
                    selectedRows: [],
                    // 对话框
                    dialogVisible: false,
                    dialogTitle: '添加条件剔除',
                    isEdit: false,
                    // 表单
                    form: {
                        id: null,
                        name: '',
                        type: '回路',
                        is_excluded: true,
                        reason: ''
                    },
                    formRules: {
                        name: [
                            { required: true, message: '请输入名称', trigger: 'blur' }
                        ],
                        type: [
                            { required: true, message: '请选择类型', trigger: 'change' }
                        ]
                    },
                    submitLoading: false,
                    // 批量添加
                    batchDialogVisible: false,
                    batchForm: {
                        urisText: '',
                        type: '回路',
                        reason: ''
                    },
                    batchFormRules: {
                        urisText: [
                            { required: true, message: '请输入URI列表', trigger: 'blur' }
                        ],
                        type: [
                            { required: true, message: '请选择类型', trigger: 'change' }
                        ]
                    }
                }
            },
            mounted() {
                this.loadData();
            },
            methods: {
                // 加载数据
                async loadData() {
                    this.loading = true;
                    try {
                        const params = {
                            page_no: this.pagination.pageNo,
                            page_size: this.pagination.pageSize
                        };
                        if (this.searchForm.name) params.name = this.searchForm.name;
                        if (this.searchForm.type) params.type = this.searchForm.type;
                        if (this.searchForm.is_excluded !== null) params.is_excluded = this.searchForm.is_excluded;

                        const response = await axios.get('/api/v1/excluded-loop/list', { params });
                        
                        if (response.data.code === 0) {
                            this.tableData = response.data.data.excluded_loops;
                            this.pagination = response.data.data.pagination;
                        } else {
                            this.$message.error('加载数据失败: ' + response.data.message);
                        }
                    } catch (error) {
                        console.error('加载数据失败:', error);
                        this.$message.error('加载数据失败: ' + (error.response?.data?.detail || error.message));
                    } finally {
                        this.loading = false;
                    }
                },
                // 搜索
                handleSearch() {
                    this.pagination.pageNo = 1;
                    this.loadData();
                },
                // 重置
                handleReset() {
                    this.searchForm = {
                        name: '',
                        type: '',
                        is_excluded: null
                    };
                    this.pagination.pageNo = 1;
                    this.loadData();
                },
                // 添加
                handleAdd() {
                    this.dialogTitle = '添加条件剔除';
                    this.isEdit = false;
                    this.form = {
                        id: null,
                        name: '',
                        type: '回路',
                        is_excluded: true,
                        reason: ''
                    };
                    this.dialogVisible = true;
                },
                // 编辑
                handleEdit(row) {
                    this.dialogTitle = '编辑条件剔除';
                    this.isEdit = true;
                    this.form = {
                        id: row.id,
                        name: row.name,
                        type: row.type,
                        is_excluded: row.is_excluded,
                        reason: row.reason
                    };
                    this.dialogVisible = true;
                },
                // 删除
                handleDelete(row) {
                    this.$confirm(`确定要删除名称为 "${row.name}" 的记录吗？`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            const response = await axios.delete(`/api/v1/excluded-loop/${row.id}`);
                            if (response.data.code === 0) {
                                this.$message.success('删除成功');
                                this.loadData();
                            } else {
                                this.$message.error('删除失败: ' + response.data.message);
                            }
                        } catch (error) {
                            console.error('删除失败:', error);
                            this.$message.error('删除失败: ' + (error.response?.data?.detail || error.message));
                        }
                    }).catch(() => {});
                },
                // 提交表单
                handleSubmit() {
                    this.$refs.form.validate(async (valid) => {
                        if (!valid) return;
                        
                        this.submitLoading = true;
                        try {
                            let response;
                            if (this.isEdit) {
                                // 更新
                                response = await axios.put(`/api/v1/excluded-loop/${this.form.id}`, null, {
                                    params: {
                                        name: this.form.name,
                                        type: this.form.type,
                                        reason: this.form.reason,
                                        is_excluded: this.form.is_excluded
                                    }
                                });
                            } else {
                                // 添加
                                response = await axios.post('/api/v1/excluded-loop/add', null, {
                                    params: {
                                        name: this.form.name,
                                        type: this.form.type,
                                        reason: this.form.reason,
                                        is_excluded: this.form.is_excluded
                                    }
                                });
                            }
                            
                            if (response.data.code === 0) {
                                this.$message.success(this.isEdit ? '更新成功' : '添加成功');
                                this.dialogVisible = false;
                                this.loadData();
                            } else {
                                this.$message.error((this.isEdit ? '更新失败: ' : '添加失败: ') + response.data.message);
                            }
                        } catch (error) {
                            console.error('操作失败:', error);
                            this.$message.error('操作失败: ' + (error.response?.data?.detail || error.message));
                        } finally {
                            this.submitLoading = false;
                        }
                    });
                },
                // 批量添加
                handleBatchAdd() {
                    this.batchForm = {
                        urisText: '',
                        type: '回路',
                        reason: ''
                    };
                    this.batchDialogVisible = true;
                },
                // 批量添加提交
                handleBatchSubmit() {
                    this.$refs.batchForm.validate(async (valid) => {
                        if (!valid) return;
                        
                        const uris = this.batchForm.urisText.split('\n')
                            .map(u => u.trim())
                            .filter(u => u.length > 0);
                        
                        if (uris.length === 0) {
                            this.$message.warning('请输入至少一个URI');
                            return;
                        }
                        
                        this.submitLoading = true;
                        try {
                            const response = await axios.post('/api/v1/excluded-loop/batch-add', {
                                uris: uris,
                                type: this.batchForm.type,
                                reason: this.batchForm.reason
                            });
                            
                            if (response.data.code === 0) {
                                const result = response.data.data;
                                this.$message.success(`批量添加完成！成功: ${result.success}, 失败: ${result.failed}`);
                                if (result.failed > 0 && result.failed_details) {
                                    console.log('失败详情:', result.failed_details);
                                }
                                this.batchDialogVisible = false;
                                this.loadData();
                            } else {
                                this.$message.error('批量添加失败: ' + response.data.message);
                            }
                        } catch (error) {
                            console.error('批量添加失败:', error);
                            this.$message.error('批量添加失败: ' + (error.response?.data?.detail || error.message));
                        } finally {
                            this.submitLoading = false;
                        }
                    });
                },
                // 批量移除
                handleBatchRemove() {
                    const uris = this.selectedRows.map(row => row.uri);
                    this.$confirm(`确定要移除选中的 ${uris.length} 条记录的剔除状态吗？`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            const response = await axios.post('/api/v1/excluded-loop/batch-remove', uris);
                            if (response.data.code === 0) {
                                const result = response.data.data;
                                this.$message.success(`批量移除完成！成功: ${result.success}, 失败: ${result.failed}`);
                                this.loadData();
                            } else {
                                this.$message.error('批量移除失败: ' + response.data.message);
                            }
                        } catch (error) {
                            console.error('批量移除失败:', error);
                            this.$message.error('批量移除失败: ' + (error.response?.data?.detail || error.message));
                        }
                    }).catch(() => {});
                },
                // 批量删除
                handleBatchDelete() {
                    this.$confirm(`确定要删除选中的 ${this.selectedRows.length} 条记录吗？此操作不可恢复！`, '警告', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'error'
                    }).then(async () => {
                        let successCount = 0;
                        let failCount = 0;
                        
                        for (const row of this.selectedRows) {
                            try {
                                const response = await axios.delete(`/api/v1/excluded-loop/${row.id}`);
                                if (response.data.code === 0) {
                                    successCount++;
                                } else {
                                    failCount++;
                                }
                            } catch (error) {
                                failCount++;
                                console.error(`删除ID ${row.id} 失败:`, error);
                            }
                        }
                        
                        this.$message.success(`批量删除完成！成功: ${successCount}, 失败: ${failCount}`);
                        this.loadData();
                    }).catch(() => {});
                },
                // 选择变化
                handleSelectionChange(selection) {
                    this.selectedRows = selection;
                },
                // 分页大小变化
                handleSizeChange(size) {
                    this.pagination.pageSize = size;
                    this.pagination.pageNo = 1;
                    this.loadData();
                },
                // 当前页变化
                handleCurrentChange(page) {
                    this.pagination.pageNo = page;
                    this.loadData();
                },
                // 对话框关闭
                handleDialogClose() {
                    this.$refs.form.resetFields();
                },
                // 格式化时间
                formatTime(time) {
                    if (!time) return '-';
                    return time.replace('T', ' ').substring(0, 19);
                }
            }
        });
    </script>
</body>
</html>
