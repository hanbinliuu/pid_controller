services:
  # Backend API Service
  backend:
    build:
      context: ../..
      dockerfile: web_tuning/docker/Dockerfile
    container_name: pid-tuning-backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pid-network

  # Frontend Service (Nginx)
  frontend:
    image: nginx:alpine
    container_name: pid-tuning-frontend
    ports:
      - "8080:80"
    volumes:
      - ../frontend:/usr/share/nginx/html/frontend:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pid-network

  # OPC UA Server (Optional)
  opcua-server:
    build:
      context: ../..
      dockerfile: web_tuning/docker/Dockerfile
    container_name: pid-tuning-opcua
    command: python servers/opcua_realistic_server.py
    ports:
      - "4840:4840"
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped
    networks:
      - pid-network
    profiles:
      - with-opcua

networks:
  pid-network:
    driver: bridge

volumes:
  data:
  logs:
